name: K3s Edge GitOps & Linting CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-and-validate:
    name: 🔍 代码规范扫描、YAML 语法校验与崩溃切片捕获
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: 📥 检出最新 Git 仓库代码
        uses: actions/checkout@v4

      # 2. 安装基础工具
      - name: 🛠️ 安装基础扫描与语法检查工具
        run: |
          sudo apt-get update -y
          sudo apt-get install -y shellcheck python3-yaml

      # 3. 扫描 Shell 脚本（带错误切片捕获）
      - name: 🛡️ 执行 Shell 脚本静态代码扫描 (ShellCheck)
        run: |
          set -o pipefail
          echo "=== 开始扫描项目内所有 .sh 运维脚本 ==="
          if ! find . -name "*.sh" -not -path "*/.*" -exec shellcheck -S warning {} + 2>&1 | tee -a error_slice.log; then
            echo "❌ Shell 脚本扫描发现不合规项！"
            exit 1
          fi
          echo "✅ Shell 脚本安全扫描全部通过！"

      # 4. 校验 Kubernetes Manifests YAML 语法（带错误切片捕获）
      - name: ☸️ 校验 Kubernetes Manifests 清单语法有效性
        run: |
          set -o pipefail
          echo "=== 开始校验 manifests/ 下的所有 YAML 清单 ==="
          python3 -c "
          import glob, yaml, sys
          yaml_files = glob.glob('manifests/**/*.yaml', recursive=True) + glob.glob('manifests/**/*.yml', recursive=True)
          for f in yaml_files:
              try:
                  with open(f, 'r') as stream:
                      list(yaml.safe_load_all(stream))
                  print(f'✅ [PASS] {f}')
              except Exception as e:
                  print(f'❌ [FAIL] {f}:\n{e}', file=sys.stderr)
                  sys.exit(1)
          " 2>&1 | tee -a error_slice.log
          echo "✅ 所有 Kubernetes 编排清单语法校验通过！"

      # 5. 飞书 ChatOps 双态自适应通知 (成功发绿卡 / 失败带崩溃日志切片发红卡)
      - name: 📢 发送飞书 ChatOps CI 构建结果通知卡片
        if: always()
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          JOB_STATUS: ${{ job.status }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          AUTHOR: ${{ github.actor }}
          COMMIT_HASH: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 -c "
          import os, json, urllib.request

          webhook = os.getenv('FEISHU_WEBHOOK', '')
          if not webhook:
              print('[-] 未配置 FEISHU_WEBHOOK，跳过推送')
              exit(0)

          status = os.getenv('JOB_STATUS', 'unknown')
          author = os.getenv('AUTHOR', 'Unknown')
          commit_hash = os.getenv('COMMIT_HASH', '')[:7]
          commit_msg = os.getenv('COMMIT_MSG', '').strip().split('\n')[0]
          run_url = os.getenv('RUN_URL', '')

          # 提取最后 6 行错误并去掉首尾空白
          error_slice = ''
          if os.path.exists('error_slice.log') and status != 'success':
              with open('error_slice.log', 'r') as f:
                  lines = [line.strip() for line in f.readlines() if line.strip()]
                  error_slice = '\n'.join(lines[-6:])

          # 飞书纯代码块语法：```\n内容\n``` (不加 text 或 bash 后缀)
          formatted_error = f'```\n{error_slice}\n```' if error_slice else '⚠️ 未捕获到文本切片'

          if status == 'success':
              header_template = 'green'
              title = '✅ 【CI 构建通过】K3s 边缘云原生资产校验成功'
              summary_text = '🟢 **所有 Shell 脚本规范与 Kubernetes YAML 语法检查 100% 通过**'
              detail_elements = [
                  {
                      'tag': 'div',
                      'text': {'tag': 'lark_md', 'content': f'**📝 提交说明**:\n{commit_msg}\n\n{summary_text}'}
                  }
              ]
          else:
              header_template = 'red'
              title = '❌ 【CI 流水线阻断】K3s 资产发现语法或规范错误'
              summary_text = '🔴 **检测到 Shell 脚本不合规或 YAML 语法异常，流水线已安全阻断**'
              detail_elements = [
                  {
                      'tag': 'div',
                      'text': {'tag': 'lark_md', 'content': f'**📝 提交说明**:\n{commit_msg}\n\n{summary_text}'}
                  },
                  {
                      'tag': 'div',
                      'text': {
                          'tag': 'lark_md',
                          'content': f'🚨 **崩溃现场错误切片 (Error Slice)**:\n```text\n{error_slice}\n```' if error_slice else '⚠️ 未捕获到文本切片，请点击下方详情按钮排查。'
                      }
                  }
              ]

          card_payload = {
              'msg_type': 'interactive',
              'card': {
                  'config': {'wide_screen_mode': True},
                  'header': {
                      'template': header_template,
                      'title': {'content': title, 'tag': 'plain_text'}
                  },
                  'elements': [
                      {
                          'tag': 'div',
                          'fields': [
                              {'is_short': True, 'text': {'tag': 'lark_md', 'content': f'**👤 触发者**\n{author}'}},
                              {'is_short': True, 'text': {'tag': 'lark_md', 'content': f'**🔖 Commit**\n{commit_hash}'}}
                          ]
                      },
                      {'tag': 'hr'}
                  ] + detail_elements + [
                      {
                          'tag': 'action',
                          'actions': [
                              {
                                  'tag': 'button',
                                  'text': {'tag': 'plain_text', 'content': '🔍 查看 GitHub Actions 云端构建详情'},
                                  'type': 'primary' if status == 'success' else 'danger',
                                  'url': run_url
                              }
                          ]
                      }
                  ]
              }
          }

          req = urllib.request.Request(
              webhook,
              data=json.dumps(card_payload).encode('utf-8'),
              headers={'Content-Type': 'application/json'}
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  print(f'[+] 飞书双态卡片推送成功，状态码: {resp.status}')
          except Exception as e:
              print(f'[-] 飞书卡片推送失败: {e}')
          "
