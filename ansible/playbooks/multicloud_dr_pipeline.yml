---
# ==============================================================================
# 跨国多云自动化容灾流水线 (AliCloud Chengdu -> Local Bastion -> AWS Tokyo)
# 生产加固版：保留原版三阶段全量拓扑，增强 Retention 7天生命周期轮转与只读任务防抖
# ==============================================================================

# ------------------------------------------------------------------------------
# 阶段 1：在 ali-db 生产端调用容器执行 dexp 全备、压缩并计算 MD5
# ------------------------------------------------------------------------------
- name: 📦 [生产端 ali-db] 调度达梦容器化全备与 MD5 指纹生成
  hosts: database_primary
  gather_facts: no
  vars:
    backup_host_dir: "/opt/dm8/backup"
    container_backup_dir: "/opt/dmdbms/backup"
  tasks:
    - name: 1. 动态生成备份时间戳
      set_fact:
        backup_tag: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"

    - name: 2. 在 Docker 容器内部调用 dexp 导出生产数据
      shell: |
        docker exec -u dmdba dm8_server env LD_LIBRARY_PATH=/opt/dmdbms/bin \
          /opt/dmdbms/bin/dexp SYSDBA/SYSDBA001@localhost:5236 \
          FILE=ali_dm8_prod_{{ backup_tag }}.dmp \
          DIRECTORY={{ container_backup_dir }} \
          LOG=ali_dm8_prod_{{ backup_tag }}.log

    - name: 3. 在宿主机进行 Gzip 动态压缩
      shell: |
        cd {{ backup_host_dir }}
        gzip -f ali_dm8_prod_{{ backup_tag }}.dmp

    - name: 4. 生成 MD5 密码学数字指纹
      shell: |
        cd {{ backup_host_dir }}
        md5sum ali_dm8_prod_{{ backup_tag }}.dmp.gz > ali_dm8_prod_{{ backup_tag }}.dmp.gz.md5
        awk '{print $1}' ali_dm8_prod_{{ backup_tag }}.dmp.gz.md5
      register: md5_output

    - name: 5. 提取文件物理体积
      shell: |
        size=$(ls -lh {{ backup_host_dir }}/ali_dm8_prod_{{ backup_tag }}.dmp.gz | awk '{print $5}')
        # 若为纯数字则追加 B，若已有 K/M 则保持原样
        [[ "$size" =~ ^[0-9]+$ ]] && echo "${size} B" || echo "$size"
      register: size_output

    - name: 6. 固化元数据供全网流转
      set_fact:
        real_backup_file: "ali_dm8_prod_{{ backup_tag }}.dmp.gz"
        real_backup_size: "{{ size_output.stdout }}"
        real_backup_hash: "{{ md5_output.stdout }}"

    - name: 7. 将备份压缩包与 MD5 拉取至本地堡垒机中转
      fetch:
        src: "{{ backup_host_dir }}/{{ item }}"
        dest: "/root/offsite_backups/{{ item }}"
        flat: yes
      loop:
        - "ali_dm8_prod_{{ backup_tag }}.dmp.gz"
        - "ali_dm8_prod_{{ backup_tag }}.dmp.gz.md5"

# ------------------------------------------------------------------------------
# 阶段 2：跨公网传递至 AWS 东京海外灾备池、执行双端 MD5 验签与 7天生命周期轮转
# ------------------------------------------------------------------------------
- name: 🌐 [灾备端 aws-tokyo] 接收跨国冷备并执行双端 MD5 验签与存储生命周期治理
  hosts: backup_offsite
  gather_facts: no
  vars:
    aws_backup_dir: "/home/ubuntu/offsite_backups"
    target_source: "{{ groups['database_primary'][0] }}"
  tasks:
    - name: 1. 确保 AWS 东京灾备存储池目录存在
      file:
        path: "{{ aws_backup_dir }}"
        state: directory
        mode: '0755'

    - name: 2. 跨洋推送备份压缩包与 MD5 文件至 AWS
      copy:
        src: "/root/offsite_backups/{{ item }}"
        dest: "{{ aws_backup_dir }}/{{ item }}"
        mode: '0644'
      loop:
        - "{{ hostvars[target_source]['real_backup_file'] }}"
        - "{{ hostvars[target_source]['real_backup_file'] }}.md5"

    - name: 3. 在 AWS 东京节点远程执行 MD5 密码学比对 (消除伪 changed)
      shell: |
        cd {{ aws_backup_dir }}
        md5sum -c {{ hostvars[target_source]['real_backup_file'] }}.md5
      register: aws_verify_result
      changed_when: false
      failed_when: "'OK' not in aws_verify_result.stdout"

    # --- 工业级增量加固：Retention 存储生命周期治理 ---
    - name: 4. 存储生命周期治理：检索 7 天以前的历史过期备份
      find:
        paths: "{{ aws_backup_dir }}"
        patterns: "ali_dm8_prod_*.dmp.gz*"
        age: 7d
      register: expired_backups

    - name: 5. 存储生命周期治理：物理轮转清理过期冷备介质
      file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ expired_backups.files }}"

# ------------------------------------------------------------------------------
# 阶段 3：本地堡垒机聚合元数据，向飞书推送终极跨国容灾卡片
# ------------------------------------------------------------------------------
- name: 📱 [总控台 Localhost] 飞书 ChatOps 跨国异地冷容灾归档播报
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    FEISHU_WEBHOOK: "{{ lookup('env', 'FEISHU_WEBHOOK') | default('https://open.feishu.cn/open-apis/bot/v2/hook/YOUR_FEISHU_WEBHOOK_URL', true) }}"
    source_host: "{{ groups['database_primary'][0] }}"
    target_dr: "{{ groups['backup_offsite'][0] }}"
    backup_file: "{{ hostvars[source_host]['real_backup_file'] }}"
    backup_size: "{{ hostvars[source_host]['real_backup_size'] }}"
    backup_hash: "{{ hostvars[source_host]['real_backup_hash'] }}"
    cleaned_count: "{{ hostvars[target_dr]['expired_backups']['matched'] | default(0) }}"
  tasks:
    - name: 1. 发送飞书 ChatOps 终极全链路绿卡
      uri:
        url: "{{ FEISHU_WEBHOOK }}"
        method: POST
        body_format: json
        body:
          msg_type: "interactive"
          card:
            header:
              template: "green"
              title:
                content: "🛡️ 【跨国多云容灾】阿里云达梦金库异地冷备完成 (AWS 东京)"
                tag: "plain_text"
            elements:
              - tag: "div"
                fields:
                  - is_short: true
                    text:
                      tag: "lark_md"
                      content: "**📦 真实归档文件**\n`{{ backup_file }}`"
                  - is_short: true
                    text:
                      tag: "lark_md"
                      content: "**⚖️ 压缩后体积**\n`{{ backup_size }}`"
              - tag: "hr"
              - tag: "div"
                fields:
                  - is_short: true
                    text:
                      tag: "lark_md"
                      content: "**🔒 异地 MD5 验签**\n✅ **100% 完整无损 (双端一致)**"
                  - is_short: true
                    text:
                      tag: "lark_md"
                      content: "**🔑 密码学数字指纹**\n`{{ backup_hash }}`"
              - tag: "div"
                fields:
                  - is_short: true
                    text:
                      tag: "lark_md"
                      content: "**🧹 存储生命周期**\n已自动轮转清理 `{{ cleaned_count }}` 个历史过期介质 (保留 7 天)"
                  - is_short: true
                    text:
                      tag: "lark_md"
                      content: "**🌐 容灾拓扑链路**\n`ali-db` ➔ `WSL2 堡垒机` ➔ `AWS 东京`"
              - tag: "div"
                text:
                  tag: "lark_md"
                  content: "**🤖 执行引擎**: `Ansible 跨国混合云编排流水线 (生产加固版)`"
      when: FEISHU_WEBHOOK != "https://open.feishu.cn/open-apis/bot/v2/hook/YOUR_FEISHU_WEBHOOK_URL"
