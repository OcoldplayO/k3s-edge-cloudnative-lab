apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-web-app
  namespace: edge-apps
spec:
  replicas: 2
  selector:
    matchLabels:
      app: edge-web-app
  template:
    metadata:
      labels:
        app: edge-web-app
    spec:
      containers:
      - name: web-app
        image: docker.m.daocloud.io/library/nginx:alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "50m"
            memory: "32Mi"
          limits:
            cpu: "200m"
            memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: web-app-service
  namespace: edge-apps
spec:
  type: ClusterIP
  ports:
  - name: http           # 显式声明端口名称，方便 Ingress 精准匹配
    port: 80
    targetPort: 80
  selector:
    app: edge-web-app
