apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: edge-app-ingress
  namespace: edge-apps
spec:
  ingressClassName: traefik
  # 开启 TLS 证书终结
  tls:
  - hosts:
    - app.edge.internal
    secretName: edge-tls-secret    # 挂载创建的 Secret 证书
  rules:
  - host: app.edge.internal
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web-app-service
            port:
              number: 80
