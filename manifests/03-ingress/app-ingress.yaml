apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: edge-app-ingress
  namespace: edge-apps
spec:
  ingressClassName: traefik   # 现代标准写法，消除废弃警告
  rules:
  - host: app.edge.internal
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web-app-service
            port:
              number: 80
